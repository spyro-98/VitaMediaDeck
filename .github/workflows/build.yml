name: Build VPK

on:
  push:
    branches:
      - master
      - dev
      - beta
    tags:
      - "1.*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: vitamediadeck-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    name: Public source guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Reject retired or unlicensed release files
        shell: bash
        run: |
          test ! -e sce_sys/psvitaframe.png
          test ! -e vendor/ffmpeg-vita/libavcodec.a
          test ! -e vendor/ffmpeg-vita/libavformat.a
          ! git grep -InE 'BotGuard|innertube|youtubei/v1|AIza[0-9A-Za-z_-]{20,}' -- src CMakeLists.txt assets sce_sys
          find tools -maxdepth 1 -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  build:
    name: VitaSDK Release build
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          path: VitaMediaDeck

      - name: Read locked component revisions
        id: components
        working-directory: VitaMediaDeck
        run: |
          for name in vita-hw-decoder vita-sw-decoder vita-https; do
            revision="$(sed -n "s/^${name}\.commit=//p" release/DEPENDENCIES.lock)"
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            echo "${name}=$revision" >> "$GITHUB_OUTPUT"
          done

      - name: Check out hardware decoder
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.VITAMEDIADECK_HW_REPOSITORY || format('{0}/vita-hw-decoder', github.repository_owner) }}
          ref: ${{ steps.components.outputs['vita-hw-decoder'] }}
          path: vita-hw-decoder

      - name: Check out software decoder
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.VITAMEDIADECK_SW_REPOSITORY || format('{0}/vita-sw-decoder', github.repository_owner) }}
          ref: ${{ steps.components.outputs['vita-sw-decoder'] }}
          path: vita-sw-decoder

      - name: Check out HTTPS transport
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.VITAMEDIADECK_HTTPS_REPOSITORY || format('{0}/vita-https', github.repository_owner) }}
          ref: ${{ steps.components.outputs['vita-https'] }}
          path: vita-https

      - name: Install host build tools
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache \
              build-base ca-certificates cmake curl git patch pkgconf python3 \
              tar unzip wget xz bzip2
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates cmake curl git patch pkg-config python3 \
              tar unzip wget xz-utils bzip2
          else
            echo "Unsupported VitaSDK container package manager" >&2
            exit 1
          fi

      - name: Install missing Vita port libraries
        run: |
          vita_lib="$VITASDK/arm-vita-eabi/lib"
          missing=0
          for archive in \
            libvita2d.a libfreetype.a libjpeg.a libpng.a libbz2.a libz.a \
            libmpg123.a libmbedtls.a libmbedx509.a libmbedcrypto.a libxml2.a \
            libzstd.a libsmb2.a libFLAC.a libogg.a libwebpdecoder.a; do
            if [[ ! -f "$vita_lib/$archive" ]]; then
              missing=1
              break
            fi
          done
          if [[ "$missing" == 1 ]]; then
            git clone --depth 1 https://github.com/vitasdk/vdpm.git "$RUNNER_TEMP/vdpm"
            "$RUNNER_TEMP/vdpm/vdpm" \
              libvita2d freetype libpng libjpeg-turbo zlib bzip2 mpg123 \
              mbedtls zstd libxml2 libsmb2 flac libogg libwebp
          fi

      - name: Restore pinned HTTPS stack
        id: https-cache
        uses: actions/cache@v5
        with:
          path: vita-https/build/deps/curl-mbedtls
          key: curl-mbedtls-${{ hashFiles('vita-https/tools/build-curl-mbedtls.sh', 'vita-https/patches/mbedtls-vita.patch') }}

      - name: Build pinned HTTPS stack
        if: steps.https-cache.outputs.cache-hit != 'true'
        working-directory: vita-https
        run: ./tools/build-curl-mbedtls.sh

      - name: Restore pinned libssh2
        id: libssh2-cache
        uses: actions/cache@v5
        with:
          path: VitaMediaDeck/build/deps/libssh2-vita
          key: libssh2-mbedtls-vita-${{ hashFiles('VitaMediaDeck/tools/build-libssh2-vita.sh') }}

      - name: Build pinned libssh2
        if: steps.libssh2-cache.outputs.cache-hit != 'true'
        working-directory: VitaMediaDeck
        run: ./tools/build-libssh2-vita.sh

      - name: Restore pinned FFmpeg backend
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: VitaMediaDeck/build/deps/ffmpeg-vita-hw
          key: ffmpeg-h264-vita-${{ hashFiles('VitaMediaDeck/tools/build-ffmpeg-vita-hw.sh', 'VitaMediaDeck/tools/patches/ffmpeg-vita-lifecycle.patch') }}

      - name: Build pinned FFmpeg backend
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        working-directory: VitaMediaDeck
        env:
          VITAMEDIADECK_FFMPEG_JOBS: "2"
        run: ./tools/build-ffmpeg-vita-hw.sh

      - name: Restore pinned application dependencies
        id: app-cache
        uses: actions/cache@v5
        with:
          path: |
            VitaMediaDeck/build/deps/jansson-vita
            VitaMediaDeck/build/deps/quirc-vita
            VitaMediaDeck/build/deps/stb
          key: app-dependencies-${{ hashFiles('VitaMediaDeck/tools/build-jansson-vita.sh', 'VitaMediaDeck/tools/patches/jansson-vita-no-pic.patch', 'VitaMediaDeck/tools/build-quirc-vita.sh', 'VitaMediaDeck/tools/prepare-stb-image.sh') }}

      - name: Build pinned application dependencies
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: VitaMediaDeck
        run: |
          ./tools/build-jansson-vita.sh
          ./tools/build-quirc-vita.sh
          ./tools/prepare-stb-image.sh

      - name: Prepare release licenses and sources
        working-directory: VitaMediaDeck
        run: ./tools/prepare-release-licenses.sh

      - name: Configure Release build
        working-directory: VitaMediaDeck
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        working-directory: VitaMediaDeck
        run: cmake --build build-ci --parallel 2

      - name: Validate VPK container
        working-directory: VitaMediaDeck
        run: |
          packages=(build-ci/VitaMediaDeck-*.vpk)
          [[ ${#packages[@]} == 1 ]]
          ./tools/release-audit.sh --vpk "${packages[0]}"

      - name: Package corresponding source
        working-directory: VitaMediaDeck
        run: ./tools/package-corresponding-source.sh build-ci/VitaMediaDeck-Corresponding-Source.tar.gz

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: VitaMediaDeck-VPK
          path: |
            VitaMediaDeck/build-ci/VitaMediaDeck-*.vpk
            VitaMediaDeck/build-ci/VitaMediaDeck-Corresponding-Source.tar.gz
          if-no-files-found: error
